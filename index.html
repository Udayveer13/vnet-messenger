<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>VNet Messenger Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #080a12; --panel: #121626; --accent: #7cc0ff; 
      --sent: #2c6fff; --received: #252a3d; --text: #e7e8ee; --dim: #8a8d9b;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* Login System */
    #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; transition: 0.5s; }
    .login-card { background: var(--panel); padding: 40px; border-radius: 24px; text-align: center; width: 100%; max-width: 400px; border: 1px solid #262b44; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    
    /* Layout */
    .sidebar { width: 320px; background: var(--panel); border-right: 1px solid #23283d; display: flex; flex-direction: column; }
    .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }

    /* UI Elements */
    .header { padding: 20px; background: rgba(18, 22, 38, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #23283d; display: flex; justify-content: space-between; align-items: center; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    
    input { background: #0c1020; color: #fff; border: 1px solid #2a2f50; padding: 14px; border-radius: 12px; outline: none; transition: 0.3s; width: 100%; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124, 192, 255, 0.2); }
    
    .btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: #1d233a; color: #fff; border: 1px solid #2a2f50; }

    /* Messages */
    .msg { padding: 12px 16px; border-radius: 18px; max-width: 75%; font-size: 14px; line-height: 1.5; position: relative; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 4px; }
    .received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 4px; }
    .msg-meta { display: block; font-size: 10px; margin-bottom: 4px; color: var(--dim); }

    /* Contact List */
    .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
    .contact-item { padding: 15px; border-radius: 14px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
    .contact-item:hover { background: #1d233a; }
    .contact-item.active { background: #1d233a; border-color: var(--accent); }
    .contact-name { font-weight: 600; display: block; }
    .contact-status { font-size: 11px; color: var(--dim); }

    /* QR Modal */
    #qr-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; align-items:center; justify-content:center; flex-direction:column; padding:20px; }
    .qr-container { background: #fff; padding: 20px; border-radius: 20px; }

    @media (max-width: 768px) { .sidebar { display: none; } }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <h1 style="margin: 0 0 10px 0; color: var(--accent)">VNet</h1>
    <p style="color: var(--dim); margin-bottom: 30px">Secure, Decentralized, Private.</p>
    <input id="login-username" type="text" placeholder="Choose a Username" style="margin-bottom: 20px">
    <button class="btn" onclick="initVNet()" style="width: 100%; height: 50px">Connect Now</button>
    <p id="login-log" style="font-size: 12px; margin-top: 15px; color: var(--accent)"></p>
  </div>
</div>

<div id="qr-modal" onclick="this.style.display='none'">
  <div class="qr-container" id="qrcode"></div>
  <h3 id="display-id" style="color: #fff; margin: 20px 0 5px 0"></h3>
  <p style="color: var(--dim); margin: 0">Scan this to add me</p>
</div>

<div class="sidebar">
  <div class="header" style="flex-direction: column; align-items: flex-start; gap: 15px">
    <h2 style="margin: 0">Messages</h2>
    <div style="width: 100%; display: flex; gap: 8px">
      <input id="add-friend-id" placeholder="Paste ID or Name..." style="font-size: 12px; padding: 10px">
      <button class="btn" onclick="addFriend()" style="padding: 10px">+</button>
    </div>
  </div>
  <div class="contact-list" id="contacts"></div>
</div>

<div class="main-content">
  <div class="header">
    <div>
      <span id="chat-target-name" style="font-weight: 700; font-size: 18px">Select a Contact</span>
      <div id="online-dot" style="display: none; font-size: 10px; color: #4ade80">● Online</div>
    </div>
    <button class="btn btn-secondary" onclick="openQR()">My Profile</button>
  </div>

  <div id="chat-box">
    <div style="margin: auto; text-align: center; color: var(--dim); max-width: 250px">
      <p>Welcome to VNet. Your messages are peer-to-peer and never touch a server.</p>
    </div>
  </div>

  <div style="padding: 20px; background: var(--panel); display: flex; gap: 12px; align-items: center">
    <button class="btn btn-secondary" onclick="shareLoc()" title="Share Location">📍</button>
    <input id="msg-input" placeholder="Type your message..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn" onclick="send()">Send</button>
  </div>
</div>

<script>
let peer, myFullId, activeTarget;
// We use a new key 'vnet_v6_contacts' to avoid conflicts with old broken versions
let contacts = JSON.parse(localStorage.getItem('vnet_v6_contacts') || '{}');

// 1. LOGIN & HANDSHAKE LOGIC
async function initVNet() {
    const user = document.getElementById('login-username').value.trim().toLowerCase();
    const pass = document.getElementById('login-password').value.trim();
    if(!user || !pass) return alert("Enter Username and Password");
    
    const log = document.getElementById('login-log');
    log.textContent = "Securing Mesh Connection...";

    // LEGIT SECURITY: We combine user+pass and turn it into a short code
    // This way, no one can "guess" your ID just by knowing your name.
    const secretHash = btoa(user + pass).substring(0, 8);
    myFullId = `vnet-${user}-${secretHash}`;

    peer = new Peer(myFullId, {
        debug: 1,
        secure: true,
        port: 443,
        config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]}
    });

    peer.on('open', id => {
        document.getElementById('login-overlay').style.display = 'none';
        renderContacts();
    });

    peer.on('connection', conn => {
        conn.on('data', data => {
            const senderName = conn.peer.split('-')[1];
            if(!contacts[conn.peer]) { 
                contacts[conn.peer] = { name: senderName, id: conn.peer }; 
                save(); 
            }
            receiveMsg(senderName, data);
        });
    });

    peer.on('error', err => {
        log.textContent = "Connection Error. Try a different name.";
    });
}

// 2. DATABASE SEARCH LOGIC (Your New Addition)
async function searchDatabase() {
    const query = document.getElementById('add-friend-id').value.trim().toLowerCase();
    if(!query) return;

    try {
        // Fetching your legitimate database from GitHub
        const response = await fetch('https://udayveer13.github.io/vnet-messenger/users.json');
        const data = await response.json();
        
        const friend = data.directory.find(u => u.username === query);
        
        if(friend) {
            contacts[friend.vnet_id] = { name: friend.username, id: friend.vnet_id };
            save();
            alert("Success! " + friend.username + " added.");
        } else {
            alert("User not found in VNet global directory.");
        }
    } catch (e) {
        alert("Offline: Could not reach VNet Directory.");
    }
}

// 3. MESSAGING LOGIC
function send() {
    const input = document.getElementById('msg-input');
    const txt = input.value.trim();
    if(!activeTarget || !txt) return;

    const conn = peer.connect(activeTarget);
    conn.on('open', () => {
        conn.send(txt);
        pushToUI("Me", txt, 'sent', false);
        input.value = "";
    });
}

function receiveMsg(name, data) {
    pushToUI(name, data, 'received', false);
}

function pushToUI(sender, text, type, isHTML) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.innerHTML = `<span class="msg-meta">${sender}</span>${text}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// 4. STORAGE LOGIC
function save() {
    localStorage.setItem('vnet_v6_contacts', JSON.stringify(contacts));
    renderContacts();
}

function renderContacts() {
    const container = document.getElementById('contacts');
    container.innerHTML = "";
    Object.values(contacts).forEach(c => {
        const div = document.createElement('div');
        div.className = `contact-item ${activeTarget === c.id ? 'active' : ''}`;
        div.innerHTML = `<span class="contact-name">${c.name}</span>`;
        div.onclick = () => {
            activeTarget = c.id;
            document.getElementById('chat-target-name').textContent = c.name;
            document.getElementById('chat-box').innerHTML = "";
            renderContacts();
        };
        container.appendChild(div);
    });
}
</script>
</body>
</html>
