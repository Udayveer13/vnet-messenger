<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNet Messenger Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--bg:#0c0f1d;--card:#161a2b;--ink:#e7e8ee;--accent:#7cc0ff;--ok:#8ef0b5;--sent:#2c6fff;--err:#ff6b6b;}
    *{box-sizing:border-box;font-family:ui-sans-serif,system-ui,sans-serif}
    body{margin:0;background:var(--bg);color:var(--ink);height:100vh;display:flex;overflow:hidden}
    #login-screen { position:fixed; inset:0; background:var(--bg); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login-box { background:var(--card); padding:30px; border-radius:20px; width:100%; max-width:400px; border:1px solid #262b44; text-align:center; }
    #sidebar { width: 300px; background: var(--card); border-right: 1px solid #262b44; display: flex; flex-direction: column; }
    #chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    input, button { padding: 12px; border-radius: 10px; border: 1px solid #2a2f50; background: #0c1020; color: white; outline: none; }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.4; }
    .sent { align-self: flex-end; background: var(--sent); }
    .received { align-self: flex-start; background: #263055; }
    #qr-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:1000; align-items:center; justify-content:center; flex-direction:column; }
    #qr-img { background: white; padding: 15px; border-radius: 10px; }
    @media (max-width: 600px) { #sidebar { display: none; } }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>VNet Login</h2>
      <input id="user-input" type="text" placeholder="Username" style="width:100%; margin-bottom:10px">
      <input id="key-input" type="password" placeholder="Secret Key" style="width:100%; margin-bottom:20px">
      <button id="login-btn" onclick="login()" style="width:100%">Enter Messenger</button>
      <p id="login-status" style="font-size:12px; margin-top:15px; color:var(--accent)"></p>
    </div>
  </div>

  <div id="qr-modal" onclick="this.style.display='none'">
    <div id="qr-img"></div>
    <p id="qr-text" style="color:white; margin-top:15px; font-family:monospace;"></p>
  </div>

  <div id="sidebar">
    <div style="padding:20px; border-bottom:1px solid #262b44;">
      <h3 style="margin:0 0 10px 0">Contacts</h3>
      <div style="display:flex; gap:5px">
        <input id="search-user" type="text" placeholder="Username" style="flex:1; font-size:12px">
        <button onclick="searchUser()" style="padding:5px 10px;">Add</button>
      </div>
    </div>
    <div id="contact-list"></div>
  </div>

  <div id="chat-area">
    <div style="background:var(--card); padding:15px; border-bottom:1px solid #262b44; display:flex; justify-content:space-between;">
      <strong id="chat-title">VNet Chat</strong>
      <button onclick="showQR()" style="padding:5px 10px; font-size:11px;">My QR</button>
    </div>
    <div id="chat-box"></div>
    <div style="padding:15px; display:flex; gap:10px">
      <input id="msg-input" style="flex:1" placeholder="Type a message...">
      <button id="send-btn">Send</button>
    </div>
  </div>

<script>
let peer, myId, activeTid;
let contacts = JSON.parse(localStorage.getItem('vnet_contacts') || '{}');

async function login() {
  const user = document.getElementById('user-input').value.trim().toLowerCase();
  const status = document.getElementById('login-status');
  if(!user) return alert("Enter Username");

  status.textContent = "Connecting to Secure Network...";
  myId = "vnet-" + user;

  // Optimized Peer Config
  try {
    peer = new Peer(myId, {
      debug: 3,
      config: {'iceServers': [
        { url: 'stun:stun.l.google.com:19302' },
        { url: 'stun:stun1.l.google.com:19302' }
      ]}
    });

    peer.on('open', (id) => {
      console.log('My peer ID is: ' + id);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('qr-img').innerHTML = "";
      new QRCode(document.getElementById("qr-img"), { text: id, width: 200, height: 200 });
      document.getElementById('qr-text').textContent = id;
      renderContacts();
    });

    peer.on('error', (err) => {
      status.textContent = "Error: " + err.type;
      console.error('PeerJS Error:', err);
      if(err.type === 'unavailable-id') {
        alert("This username is already online. Please try a different name.");
        status.textContent = "ID Taken. Try again.";
      }
    });

    peer.on('connection', conn => {
      conn.on('data', data => {
        if(!contacts[conn.peer]) { 
            contacts[conn.peer] = conn.peer.replace('vnet-',''); 
            saveContacts(); 
        }
        addMsg(contacts[conn.peer], data, 'received');
      });
    });

  } catch (e) {
    status.textContent = "System Error. Check Console.";
  }
}

function searchUser() {
  const name = document.getElementById('search-user').value.trim().toLowerCase();
  const fullId = name.startsWith('vnet-') ? name : 'vnet-' + name;
  if(!contacts[fullId]) { contacts[fullId] = name; saveContacts(); }
  activeTid = fullId;
  document.getElementById('chat-title').textContent = name;
  document.getElementById('chat-box').innerHTML = "";
}

function renderContacts() {
  const list = document.getElementById('contact-list');
  list.innerHTML = "";
  Object.keys(contacts).forEach(id => {
    const div = document.createElement('div');
    div.style.padding = "15px";
    div.style.borderBottom = "1px solid #2a2f50";
    div.style.cursor = "pointer";
    div.innerHTML = `<span>${contacts[id]}</span>`;
    div.onclick = () => { activeTid = id; document.getElementById('chat-title').textContent = contacts[id]; };
    list.appendChild(div);
  });
}

function addMsg(sender, text, type) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  document.getElementById('chat-box').appendChild(div);
  document.getElementById('chat-box').scrollTop = 99999;
}

document.getElementById('send-btn').onclick = () => {
  const msg = document.getElementById('msg-input').value;
  if(!activeTid || !msg) return;
  const conn = peer.connect(activeTid);
  conn.on('open', () => {
    conn.send(msg);
    addMsg("Me", msg, 'sent');
    document.getElementById('msg-input').value = "";
  });
};

function saveContacts() { localStorage.setItem('vnet_contacts', JSON.stringify(contacts)); renderContacts(); }
function showQR() { document.getElementById('qr-modal').style.display = 'flex'; }
</script>
</body>
</html>
