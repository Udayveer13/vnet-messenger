<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNet Messenger</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root{--bg:#0f1220;--card:#161a2b;--ink:#e7e8ee;--accent:#7cc0ff;--ok:#8ef0b5;}
    body{margin:0;background:#0c0f1d;color:var(--ink);font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
    .header{background:var(--card);padding:15px;border-bottom:1px solid #262b44;text-align:center}
    #chat-box{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
    .msg-bubble{padding:10px 15px;border-radius:15px;max-width:80%;word-wrap:break-word}
    .sent{align-self:flex-end;background:linear-gradient(135deg,#2c6fff,#8b5cf6);color:#fff}
    .received{align-self:flex-start;background:#263055}
    .footer{background:var(--card);padding:15px;display:flex;gap:10px;border-top:1px solid #262b44}
    input,button{padding:12px;border-radius:12px;border:none;outline:none}
    input{flex:1;background:#0c1020;color:#fff;border:1px solid #2a2f50}
    button{background:var(--accent);color:#0f1220;font-weight:700;cursor:pointer}
    .id-display{font-size:11px;color:var(--ok);margin-top:5px;cursor:pointer}
  </style>
</head>
<body>

<div class="header">
  <strong>VNet Messenger</strong>
  <div id="my-id" class="id-display">Initializing My ID...</div>
</div>

<div id="chat-box">
  <!-- Messages appear here -->
</div>

<div class="footer">
  <input id="target-id" type="text" style="width: 80px; flex:none" placeholder="Friend ID">
  <input id="msg-input" type="text" placeholder="Type a message...">
  <button id="send-btn">Send</button>
</div>

<script>
let peer;
let myId;
const chatBox = document.getElementById('chat-box');

// 1. Start the Peer Network
function init() {
  peer = new Peer();
  
  peer.on('open', id => {
    myId = id;
    document.getElementById('my-id').textContent = "My ID: " + id + " (Tap to copy)";
  });

  // 2. Receive Messages
  peer.on('connection', conn => {
    conn.on('data', data => {
      addMessage(data, 'received');
    });
  });
}

// 3. UI Helpers
function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = `msg-bubble ${type}`;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 4. Send Message
document.getElementById('send-btn').addEventListener('click', () => {
  const targetId = document.getElementById('target-id').value;
  const msg = document.getElementById('msg-input').value;
  
  if(!targetId || !msg) return;

  const conn = peer.connect(targetId);
  conn.on('open', () => {
    conn.send(msg);
    addMessage(msg, 'sent');
    document.getElementById('msg-input').value = "";
  });
});

// Copy ID on click
document.getElementById('my-id').addEventListener('click', () => {
  navigator.clipboard.writeText(myId);
  alert("ID Copied!");
});

init();
</script>
</body>
</html>
