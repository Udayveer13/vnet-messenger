<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNet Messenger</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root{--bg:#0f1220;--card:#161a2b;--ink:#e7e8ee;--accent:#7cc0ff;--ok:#8ef0b5;--sent:#2c6fff;}
    *{box-sizing:border-box;font-family:ui-sans-serif,system-ui,sans-serif}
    body{margin:0;background:#0c0f1d;color:var(--ink);height:100vh;display:flex;overflow:hidden}
    #sidebar { width: 260px; background: var(--card); border-right: 1px solid #262b44; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; font-weight: 700; border-bottom: 1px solid #262b44; font-size: 18px; }
    #contact-list { flex: 1; overflow-y: auto; }
    .contact-item { padding: 15px 20px; border-bottom: 1px solid #2a2f50; cursor: pointer; }
    .contact-item:hover { background: #1d263f; }
    .contact-item .name { display: block; font-weight: 600; color: var(--accent); }
    .contact-item .peer-id { font-size: 10px; color: #a7a9b6; opacity: 0.6; word-break: break-all; }
    #chat-area { flex: 1; display: flex; flex-direction: column; }
    .header { background: var(--card); padding: 15px 20px; border-bottom: 1px solid #262b44; }
    #my-id-display { font-size: 11px; color: var(--ok); cursor: pointer; margin-top: 4px; display: inline-block; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 16px; border-radius: 14px; max-width: 75%; font-size: 14px; line-height: 1.4; position: relative; }
    .sent { align-self: flex-end; background: var(--sent); color: white; border-bottom-right-radius: 2px; }
    .received { align-self: flex-start; background: #263055; border-bottom-left-radius: 2px; }
    .sender-label { display: block; font-size: 10px; opacity: 0.6; margin-bottom: 4px; }
    .footer { background: var(--card); padding: 15px; border-top: 1px solid #262b44; display: flex; gap: 10px; flex-wrap: wrap; }
    input { background: #0c1020; color: white; border: 1px solid #2a2f50; border-radius: 10px; padding: 12px; outline: none; flex: 1; min-width: 150px; }
    #target-id { width: 120px; flex: none; }
    button { background: var(--accent); color: #0f1220; border: none; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer; }
    .loc-btn { background: #1d263f; color: white; font-size: 12px; }
    @media (max-width: 600px) { #sidebar { display: none; } }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">VNet Contacts</div>
    <div id="contact-list"></div>
    <button onclick="addManualContact()" style="margin: 10px; background: #263055; color: white;">+ Add Friend</button>
  </div>

  <div id="chat-area">
    <div class="header">
      <strong>VNet Messenger</strong><br>
      <span id="my-id-display">Connecting...</span>
    </div>
    <div id="chat-box"></div>
    <div class="footer">
      <input id="target-id" type="text" placeholder="Friend's ID">
      <input id="msg-input" type="text" placeholder="Type a message...">
      <button id="send-btn">Send</button>
      <button class="loc-btn" id="loc-btn">📍 Location</button>
    </div>
  </div>

<script>
let peer;
let myPeerId;
let contacts = JSON.parse(localStorage.getItem('vnet_contacts') || '{}');

function initApp() {
  const savedId = localStorage.getItem('vnet_permanent_id');
  peer = new Peer(savedId);

  peer.on('open', id => {
    myPeerId = id;
    localStorage.setItem('vnet_permanent_id', id);
    document.getElementById('my-id-display').textContent = "My ID: " + id + " (Tap to copy)";
  });

  peer.on('connection', conn => {
    conn.on('data', data => {
      if (!contacts[conn.peer]) {
        const nickname = prompt("New message from " + conn.peer + ". Name them:", "User-" + conn.peer.substring(0, 4));
        contacts[conn.peer] = nickname || conn.peer.substring(0, 5);
        saveContacts();
      }
      // If the data is a Google Maps link, make it clickable
      let messageContent = data;
      if(data.includes("google.com/maps")) {
        messageContent = `<a href="${data}" target="_blank" style="color:var(--accent)">📍 View Shared Location</a>`;
      }
      displayMessage(contacts[conn.peer], messageContent, 'received', true);
    });
  });
  renderContacts();
}

function saveContacts() {
  localStorage.setItem('vnet_contacts', JSON.stringify(contacts));
  renderContacts();
}

function renderContacts() {
  const list = document.getElementById('contact-list');
  list.innerHTML = "";
  for (let id in contacts) {
    const div = document.createElement('div');
    div.className = 'contact-item';
    div.innerHTML = `<span class="name">${contacts[id]}</span><span class="peer-id">${id}</span>`;
    div.onclick = () => { document.getElementById('target-id').value = id; };
    list.appendChild(div);
  }
}

function displayMessage(sender, text, type, isHTML = false) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  const content = isHTML ? text : text.replace(/</g, "&lt;");
  div.innerHTML = `<span class="sender-label">${sender}</span>${content}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// Share Location Logic
document.getElementById('loc-btn').addEventListener('click', () => {
  if (navigator.geolocation) {
    updateStatus("Getting location...");
    navigator.geolocation.getCurrentPosition((pos) => {
      const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
      sendMessage(mapLink);
    }, () => alert("Could not get location. Check permissions."));
  }
});

function sendMessage(text) {
  const tid = document.getElementById('target-id').value;
  if (!tid || !text) return alert("Enter Friend ID first!");

  const conn = peer.connect(tid);
  conn.on('open', () => {
    conn.send(text);
    const display = text.includes("maps") ? `<a href="${text}" target="_blank" style="color:white">📍 Sent My Location</a>` : text;
    displayMessage("Me", display, 'sent', text.includes("maps"));
    document.getElementById('msg-input').value = "";
  });
}

document.getElementById('send-btn').addEventListener('click', () => {
  sendMessage(document.getElementById('msg-input').value);
});

document.getElementById('my-id-display').addEventListener('click', () => {
  navigator.clipboard.writeText(myPeerId);
  alert("Address copied!");
});

initApp();
function updateStatus(t){ console.log(t); }
</script>
</body>
</html>
