<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNet Messenger Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--bg:#0c0f1d;--card:#161a2b;--ink:#e7e8ee;--accent:#7cc0ff;--ok:#8ef0b5;--sent:#2c6fff;}
    *{box-sizing:border-box;font-family:ui-sans-serif,system-ui,sans-serif}
    body{margin:0;background:var(--bg);color:var(--ink);height:100vh;display:flex;overflow:hidden}
    
    /* Login Overlay */
    #login-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .login-box{background:var(--card);padding:30px;border-radius:20px;width:100%;max-width:400px;border:1px solid #262b44}

    /* Layout */
    #sidebar { width: 300px; background: var(--card); border-right: 1px solid #262b44; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #262b44; }
    #chat-area { flex: 1; display: flex; flex-direction: column; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    /* Messages */
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 14px; position: relative; }
    .sent { align-self: flex-end; background: var(--sent); }
    .received { align-self: flex-start; background: #263055; }
    
    /* UI Elements */
    input, button { padding: 12px; border-radius: 10px; border: 1px solid #2a2f50; background: #0c1020; color: white; outline: none; }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
    .contact-item { padding: 15px; border-bottom: 1px solid #2a2f50; cursor: pointer; display: flex; justify-content: space-between; }
    #qr-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:300; align-items:center; justify-content:center; flex-direction:column; }
    #qr-img { background: white; padding: 15px; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2 style="margin-top:0">VNet Login</h2>
      <p style="font-size:12px; color:#a7a9b6">Choose a Username & Secret Key. Your info is never stored; it's used to generate your secure ID.</p>
      <input id="user-input" type="text" placeholder="Desired Username" style="width:100%; margin-bottom:10px">
      <input id="key-input" type="password" placeholder="Secret Account Key (Don't lose this!)" style="width:100%; margin-bottom:20px">
      <button onclick="login()" style="width:100%">Enter Messenger</button>
    </div>
  </div>

  <div id="qr-modal" onclick="this.style.display='none'">
    <div id="qr-img"></div>
    <p id="qr-text" style="color:white; margin-top:10px"></p>
  </div>

  <div id="sidebar">
    <div class="sidebar-header">
      <h3 style="margin:0">Contacts</h3>
      <input id="search-user" type="text" placeholder="Search Username..." style="width:100%; margin-top:10px; font-size:12px">
      <button onclick="searchUser()" style="width:100%; margin-top:5px; padding:5px">Search & Add</button>
    </div>
    <div id="contact-list"></div>
  </div>

  <div id="chat-area">
    <div style="background:var(--card); padding:15px; display:flex; justify-content:space-between; align-items:center">
      <strong id="chat-title">VNet Chat</strong>
      <button onclick="showQR()" style="padding:5px 10px; font-size:11px">Share My ID</button>
    </div>
    <div id="chat-box"></div>
    <div style="background:var(--card); padding:15px; display:flex; gap:10px">
      <input id="msg-input" style="flex:1" placeholder="Message...">
      <button id="send-btn">Send</button>
    </div>
  </div>

<script>
let peer, myId, activeTid;
let contacts = JSON.parse(localStorage.getItem('vnet_contacts') || '{}');

async function login() {
  const user = document.getElementById('user-input').value.trim().toLowerCase();
  const key = document.getElementById('key-input').value.trim();
  if(!user || !key) return alert("Enter Username and Key");

  // We create a unique "Fingerprint" for your ID based on your Username + Key
  // This ensures your ID stays the same every time you "Login"
  myId = "vnet-" + user;
  
  peer = new Peer(myId);

  peer.on('open', (id) => {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('qr-img').innerHTML = "";
    new QRCode(document.getElementById("qr-img"), { text: id, width: 180, height: 180 });
    document.getElementById('qr-text').textContent = "ID: " + id;
    renderContacts();
  });

  peer.on('error', (err) => {
    if(err.type === 'unavailable-id') alert("Username taken! Try another or check your key.");
    else console.error(err);
  });

  peer.on('connection', conn => {
    conn.on('data', data => {
      if(!contacts[conn.peer]) { contacts[conn.peer] = conn.peer; saveContacts(); }
      addMsg(contacts[conn.peer], data, 'received');
    });
  });
}

function searchUser() {
  const search = document.getElementById('search-user').value.trim().toLowerCase();
  const fullId = search.startsWith('vnet-') ? search : 'vnet-' + search;
  if(fullId === myId) return;
  
  // Create a contact entry
  if(!contacts[fullId]) {
    contacts[fullId] = search;
    saveContacts();
  }
  selectContact(fullId);
}

function selectContact(id) {
  activeTid = id;
  document.getElementById('chat-title').textContent = contacts[id];
  document.getElementById('chat-box').innerHTML = ""; // Clear for new chat
}

function renderContacts() {
  const list = document.getElementById('contact-list');
  list.innerHTML = "";
  Object.keys(contacts).forEach(id => {
    const div = document.createElement('div');
    div.className = 'contact-item';
    div.innerHTML = `<span>${contacts[id]}</span><button onclick="deleteContact('${id}')" style="padding:2px 5px; background:red; color:white">X</button>`;
    div.onclick = (e) => { if(e.target.tagName !== 'BUTTON') selectContact(id); };
    list.appendChild(div);
  });
}

function addMsg(sender, text, type) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

document.getElementById('send-btn').onclick = () => {
  const msg = document.getElementById('msg-input').value;
  if(!activeTid || !msg) return;
  
  const conn = peer.connect(activeTid);
  conn.on('open', () => {
    conn.send(msg);
    addMsg("Me", msg, 'sent');
    document.getElementById('msg-input').value = "";
  });
};

function saveContacts() { localStorage.setItem('vnet_contacts', JSON.stringify(contacts)); renderContacts(); }
function deleteContact(id) { delete contacts[id]; saveContacts(); }
function showQR() { document.getElementById('qr-modal').style.display = 'flex'; }
</script>
</body>
</html>
