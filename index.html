<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNet Messenger - High Performance</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root{--bg:#0f1220;--card:#161a2b;--ink:#e7e8ee;--accent:#7cc0ff;--ok:#8ef0b5;--sent:#2c6fff;}
    *{box-sizing:border-box;font-family:ui-sans-serif,system-ui,sans-serif}
    body{margin:0;background:#0c0f1d;color:var(--ink);height:100vh;display:flex;overflow:hidden}
    #sidebar { width: 280px; background: var(--card); border-right: 1px solid #262b44; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; font-weight: 700; border-bottom: 1px solid #262b44; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    #contact-list { flex: 1; overflow-y: auto; }
    .contact-item { padding: 15px 20px; border-bottom: 1px solid #2a2f50; cursor: pointer; transition: 0.2s; }
    .contact-item:hover { background: #1d263f; }
    .contact-item.active { border-left: 4px solid var(--accent); background: #1d263f; }
    .contact-item .name { display: block; font-weight: 600; color: var(--accent); }
    .contact-item .peer-id { font-size: 10px; color: #a7a9b6; opacity: 0.6; word-break: break-all; }
    #chat-area { flex: 1; display: flex; flex-direction: column; }
    .header { background: var(--card); padding: 15px 20px; border-bottom: 1px solid #262b44; display: flex; justify-content: space-between; align-items: center; }
    #my-id-display { font-size: 11px; color: var(--ok); cursor: pointer; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    .msg { padding: 10px 16px; border-radius: 14px; max-width: 80%; font-size: 14px; line-height: 1.4; animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .sent { align-self: flex-end; background: var(--sent); color: white; border-bottom-right-radius: 2px; }
    .received { align-self: flex-start; background: #263055; border-bottom-left-radius: 2px; }
    .sender-label { display: block; font-size: 10px; opacity: 0.6; margin-bottom: 4px; }
    .footer { background: var(--card); padding: 15px; border-top: 1px solid #262b44; display: flex; gap: 10px; align-items: center; }
    input { background: #0c1020; color: white; border: 1px solid #2a2f50; border-radius: 10px; padding: 12px; outline: none; flex: 1; }
    #target-id { width: 130px; flex: none; font-family: monospace; font-size: 12px; }
    button { background: var(--accent); color: #0f1220; border: none; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    .loc-btn { background: #1d263f; color: white; padding: 12px 15px; }
    @media (max-width: 600px) { #sidebar { display: none; } }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <span>Contacts</span>
      <button onclick="addManualContact()" style="padding: 5px 10px; font-size: 12px;">+ Add</button>
    </div>
    <div id="contact-list"></div>
  </div>

  <div id="chat-area">
    <div class="header">
      <strong>VNet Messenger</strong>
      <span id="my-id-display" onclick="copyId()">Connecting...</span>
    </div>
    <div id="chat-box"></div>
    <div class="footer">
      <input id="target-id" type="text" placeholder="Friend's ID">
      <input id="msg-input" type="text" placeholder="Type a message...">
      <button id="send-btn">Send</button>
      <button class="loc-btn" id="loc-btn" title="Share Location">📍</button>
    </div>
  </div>

<script>
let peer;
let activeConn = null;
let myPeerId;
let contacts = JSON.parse(localStorage.getItem('vnet_contacts') || '{}');

function initApp() {
  const savedId = localStorage.getItem('vnet_permanent_id');
  peer = new Peer(savedId);

  peer.on('open', id => {
    myPeerId = id;
    localStorage.setItem('vnet_permanent_id', id);
    document.getElementById('my-id-display').textContent = "ID: " + id.substring(0,8) + "...";
  });

  peer.on('connection', conn => {
    conn.on('data', data => {
      handleIncomingData(conn.peer, data);
    });
  });
  renderContacts();
}

function handleIncomingData(peerId, data) {
  if (!contacts[peerId]) {
    const nickname = prompt("New message from " + peerId.substring(0,6) + ". Name them:", "User-" + peerId.substring(0,4));
    contacts[peerId] = nickname || peerId.substring(0,8);
    saveContacts();
  }
  
  let content = data;
  let isHTML = false;
  if(data.includes("google.com/maps")) {
    content = `<a href="${data}" target="_blank" style="color:var(--accent); text-decoration:none;">📍 View Shared Location</a>`;
    isHTML = true;
  }
  displayMessage(contacts[peerId], content, 'received', isHTML);
}

function addManualContact() {
  const id = prompt("Paste Friend's Full Peer ID:");
  if (id && id.trim().length > 5) {
    const name = prompt("Give this friend a nickname:");
    contacts[id.trim()] = name || "User-" + id.substring(0,4);
    saveContacts();
    alert("Friend Added!");
  } else if (id) {
    alert("Invalid ID format.");
  }
}

function saveContacts() {
  localStorage.setItem('vnet_contacts', JSON.stringify(contacts));
  renderContacts();
}

function renderContacts() {
  const list = document.getElementById('contact-list');
  list.innerHTML = "";
  for (let id in contacts) {
    const div = document.createElement('div');
    div.className = 'contact-item';
    div.innerHTML = `<span class="name">${contacts[id]}</span><span class="peer-id">${id.substring(0,20)}...</span>`;
    div.onclick = () => { 
      document.getElementById('target-id').value = id; 
      document.getElementById('msg-input').focus();
      const items = document.querySelectorAll('.contact-item');
      items.forEach(i => i.classList.remove('active'));
      div.classList.add('active');
    };
    list.appendChild(div);
  }
}

function displayMessage(sender, text, type, isHTML = false) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  const content = isHTML ? text : text.replace(/</g, "&lt;");
  div.innerHTML = `<span class="sender-label">${sender}</span>${content}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMessage(text) {
  const tid = document.getElementById('target-id').value.trim();
  if (!tid) return alert("Select a contact or enter a Friend ID.");
  if (!text) return;

  // Optimized Connection: Reuse connection if possible to remove lag
  if (!activeConn || activeConn.peer !== tid || !activeConn.open) {
    activeConn = peer.connect(tid);
    activeConn.on('open', () => {
      activeConn.send(text);
      finalizeSend(text);
    });
    activeConn.on('error', () => alert("Connection failed. Friend might be offline."));
  } else {
    activeConn.send(text);
    finalizeSend(text);
  }
}

function finalizeSend(text) {
  const isLoc = text.includes("google.com/maps");
  const display = isLoc ? `<a href="${text}" target="_blank" style="color:white; text-decoration:none;">📍 Sent Location</a>` : text;
  displayMessage("Me", display, 'sent', isLoc);
  document.getElementById('msg-input').value = "";
}

document.getElementById('send-btn').addEventListener('click', () => {
  sendMessage(document.getElementById('msg-input').value);
});

document.getElementById('msg-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage(document.getElementById('msg-input').value);
});

document.getElementById('loc-btn').addEventListener('click', () => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((pos) => {
      const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
      sendMessage(mapLink);
    }, () => alert("Location denied."));
  }
});

function copyId() {
  navigator.clipboard.writeText(myPeerId);
  alert("Your ID Copied!");
}

initApp();
</script>
</body>
</html>
