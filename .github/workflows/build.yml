name: VNet APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Buildozer Action
        uses: kivy/buildozer-action@v1
        with:
          python_version: 3.11
          buildozer_version: stable
        env:
          # This helps avoid the memory crashes we saw earlier
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VNet-Messenger
          path: bin/*.apk
          
